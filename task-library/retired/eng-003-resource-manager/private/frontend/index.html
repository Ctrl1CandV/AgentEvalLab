<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resource Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar"><h1>Resource Manager</h1><p class="sub">Local persistence · Form validation · Import and export</p></header>
  <main class="layout">
    <section class="card" aria-labelledby="form-h">
      <h2 id="form-h">Add / edit</h2>
      <form id="res-form" novalidate>
        <input type="hidden" id="f-id" />
        <label>Title *<input id="f-title" required maxlength="200" /></label>
        <label>URL *<input id="f-url" type="url" placeholder="https://" required /></label>
        <label>Tags (comma-separated)<input id="f-tags" placeholder="dev, python" /></label>
        <label>Notes<textarea id="f-notes" maxlength="5000"></textarea></label>
        <div class="row"><button type="submit">Save</button><button type="button" id="reset">Clear</button></div>
        <p id="form-msg" class="msg" role="status"></p>
      </form>
    </section>
    <section class="card" aria-labelledby="list-h">
      <h2 id="list-h">Resources</h2>
      <div class="row filters">
        <input id="q-text" placeholder="Search title/notes/URL" /><input id="q-tag" placeholder="Filter by tag" />
        <button id="do-filter">Filter</button>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>No resources yet. Add one using the form.</p>
      <div class="row io">
        <button id="exp-json">Export JSON</button><button id="exp-csv">Export CSV</button>
        <label class="file">Import<input id="imp-file" type="file" accept=".json,.csv" /></label>
        <select id="imp-mode"><option value="merge">merge</option><option value="replace">replace</option></select>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
