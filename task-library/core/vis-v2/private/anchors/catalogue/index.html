<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue · Larkspur Public Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="inner">
    <p class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7h9a3 3 0 0 1 3 3v16a3 3 0 0 0-3-3H5z M27 7h-9a3 3 0 0 0-1 0.2V26a3 3 0 0 1 3-3h7z"/></svg><span id="brand"></span></p>
    <h1 id="title"></h1>
  </div>
</header>
<main class="inner">
  <section class="controls" aria-label="Find a book">
    <div class="field search">
      <label for="search">Search titles</label>
      <input id="search" type="search" data-role="search-input" placeholder="Try “river” or “history”" autocomplete="off">
    </div>
    <div class="field">
      <label for="genre">Genre</label>
      <select id="genre" data-role="genre-filter"></select>
    </div>
    <button type="button" class="sort" data-role="sort-year" id="sort" aria-pressed="false"></button>
  </section>
  <p class="count" data-role="results-count" role="status" aria-live="polite"></p>
  <div class="table-scroll">
    <table data-role="books-table">
      <caption class="visually-hidden">Books in the catalogue</caption>
      <thead><tr><th scope="col">Title</th><th scope="col">Author</th><th scope="col">Genre</th><th scope="col" id="year-head" class="num">Year</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="empty" id="empty" hidden>No books match. Try a shorter search or another genre.</p>
  </div>
</main>
<footer class="inner footer">Larkspur Public Library · Open Monday to Saturday, 9:00–19:00</footer>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
