# Runtime for the harness, task graders, public checkers and candidate code.
# Keep it to interpreters only: task contracts require the Python standard
# library, so third-party packages here would hide contract violations.
#   mamba env create -f environment.yml && conda activate agenteval
name: agenteval
channels:
  - conda-forge
dependencies:
  - python=3.13.15
  - nodejs=22.23.2
